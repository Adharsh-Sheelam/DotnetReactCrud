trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: static-web-app-tokens
  - name: buildConfiguration
    value: 'Release'
  - name: apiSolution
    value: 'Backend/Backend.sln'
  - name: apiProject
    value: 'Backend/Backend/Backend.csproj'
  - name: testProject
    value: 'Backend/Backend.Tests/Backend.Tests.csproj'
  - name: azureServiceConnection
    value: 'azure-cleanarch-connection'

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  displayName: 'Build, Test, and Package'
  jobs:
  - job: BuildBackend
    displayName: 'Build and Test .NET API'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 9 SDK'
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - script: dotnet restore "$(apiSolution)"
      displayName: 'Restore NuGet packages'

    - script: |
        dotnet build "$(apiSolution)" \
          --configuration "$(buildConfiguration)" \
          --no-restore
      displayName: 'Build .NET solution'

    - task: DotNetCoreCLI@2
      displayName: 'Run unit tests'
      inputs:
        command: 'test'
        projects: '$(testProject)'
        arguments: '--configuration $(buildConfiguration) --no-build'
        publishTestResults: true

    - script: |
        dotnet publish "$(apiProject)" \
          --configuration "$(buildConfiguration)" \
          --output "$(Build.ArtifactStagingDirectory)/api" \
          --no-build
      displayName: 'Publish .NET API'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish API artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/api'
        ArtifactName: 'api-drop'
        publishLocation: 'Container'

  - job: BuildFrontend
    displayName: 'Build React Frontend'
    steps:
    - task: UseNode@1
      displayName: 'Install Node.js 20'
      inputs:
        version: '20.x'

    - script: |
        cd client
        npm ci
        npm run build
      displayName: 'Install dependencies and build React'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish React artifact'
      inputs:
        PathtoPublish: 'client/dist'
        ArtifactName: 'web-drop'
        publishLocation: 'Container'

# =========================
# DEPLOY TO DEV
# =========================
- stage: DeployDev
  displayName: 'Deploy to Dev'
  dependsOn: Build
  jobs:
  - deployment: DeployAPIDev
    displayName: 'Deploy API to Dev'
    environment: 'Dev'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (Dev)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: 'cleanarch-api-dev-arsh123'
              package: '$(Pipeline.Workspace)/api-drop'

  - deployment: DeployWebDev
    displayName: 'Deploy Web to Dev'
    environment: 'Dev'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Static Web App (Dev)'
            inputs:
              app_location: '$(Pipeline.Workspace)/web-drop'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(SWA_TOKEN_DEV)'

# =========================
# DEPLOY TO UAT
# =========================
- stage: DeployUAT
  displayName: 'Deploy to UAT'
  dependsOn: DeployDev
  jobs:
  - deployment: DeployAPIUAT
    displayName: 'Deploy API to UAT'
    environment: 'UAT'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (UAT)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: 'cleanarch-api-uat-arsh123'
              package: '$(Pipeline.Workspace)/api-drop'

  - deployment: DeployWebUAT
    displayName: 'Deploy Web to UAT'
    environment: 'UAT'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Static Web App (UAT)'
            inputs:
              app_location: '$(Pipeline.Workspace)/web-drop'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(SWA_TOKEN_UAT)'

# =========================
# DEPLOY TO PROD
# =========================
- stage: DeployProd
  displayName: 'Deploy to Prod'
  dependsOn: DeployUAT
  jobs:
  - deployment: DeployAPIProd
    displayName: 'Deploy API to Prod'
    environment: 'Prod'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (Prod)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: 'cleanarch-api-prod-arsh123'
              package: '$(Pipeline.Workspace)/api-drop'

  - deployment: DeployWebProd
    displayName: 'Deploy Web to Prod'
    environment: 'Prod'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Static Web App (Prod)'
            inputs:
              app_location: '$(Pipeline.Workspace)/web-drop'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(SWA_TOKEN_PROD)'